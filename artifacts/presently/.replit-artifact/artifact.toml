kind = "web"
previewPath = "/"
title = "Presently"
version = "1.0.0"
id = "artifacts/presently"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24579

[services.development]
run = "pnpm --filter @workspace/presently run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/presently", "run", "build" ]
publicDir = "artifacts/presently/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24579"
BASE_PATH = "/"
