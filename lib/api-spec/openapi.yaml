openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Presently mental health app API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: checkins
  - name: community
  - name: meditation
  - name: goals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /checkins:
    get:
      operationId: getCheckins
      tags: [checkins]
      responses:
        "200":
          description: List of check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Checkin"
    post:
      operationId: createCheckin
      tags: [checkins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckinRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinWithReflection"

  /checkins/streak:
    get:
      operationId: getStreak
      tags: [checkins]
      responses:
        "200":
          description: Streak stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakStats"

  /checkins/{id}/quote:
    get:
      operationId: getCheckinQuote
      tags: [checkins]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteCard"
        "404":
          description: Not found

  /meditation:
    get:
      operationId: getMeditationSessions
      tags: [meditation]
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeditationSession"
    post:
      operationId: logMeditationSession
      tags: [meditation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeditationRequest"
      responses:
        "201":
          description: Logged session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeditationSession"

  /meditation/streak:
    get:
      operationId: getMeditationStreak
      tags: [meditation]
      responses:
        "200":
          description: Meditation streak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeditationStreakStats"

  /community:
    get:
      operationId: getCommunityFeed
      tags: [community]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Community posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityFeedResponse"

  /community/{id}/hug:
    post:
      operationId: sendHug
      tags: [community]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated hugs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HugResponse"

  /community/{id}/like:
    post:
      operationId: sendLike
      tags: [community]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated likes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"

  /community/{id}/checkon:
    post:
      operationId: checkOnPost
      tags: [community]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated check-ons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckOnResponse"

  /community/{id}/replies:
    get:
      operationId: getCommunityReplies
      tags: [community]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Replies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityReply"
    post:
      operationId: addCommunityReply
      tags: [community]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplyRequest"
      responses:
        "201":
          description: Created reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReply"

  /goals:
    get:
      operationId: getGoals
      tags: [goals]
      summary: Get all goals for the current user
      responses:
        "200":
          description: Goals list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a new goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal (complete, rename, toggle public)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalRequest"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteGoalResponse"
        "404":
          description: Not found

  /goals/community:
    get:
      operationId: getCommunityGoals
      tags: [goals]
      summary: Get public goals from the community for accountability
      responses:
        "200":
          description: Public community goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityGoal"

  /goals/community/{id}/cheer:
    post:
      operationId: cheerGoal
      tags: [goals]
      summary: Send a cheer to someone's public goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated cheers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheerResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Checkin:
      type: object
      properties:
        id:
          type: integer
        mood:
          type: integer
        journal:
          type: ["string", "null"]
        aiReflection:
          type: ["string", "null"]
        quoteText:
          type: ["string", "null"]
        sharedToCommunity:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, mood, sharedToCommunity, createdAt]

    CreateCheckinRequest:
      type: object
      properties:
        mood:
          type: integer
          minimum: 1
          maximum: 5
        journal:
          type: ["string", "null"]
        shareAnonymously:
          type: boolean
          default: false
      required: [mood]

    CheckinWithReflection:
      type: object
      properties:
        checkin:
          $ref: "#/components/schemas/Checkin"
        reflection:
          type: string
        quoteCard:
          $ref: "#/components/schemas/QuoteCard"
      required: [checkin, reflection, quoteCard]

    QuoteCard:
      type: object
      properties:
        quote:
          type: string
        mood:
          type: integer
        date:
          type: string
      required: [quote, mood, date]

    StreakStats:
      type: object
      properties:
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        totalCheckins:
          type: integer
        weeklyMoods:
          type: array
          items:
            $ref: "#/components/schemas/DailyMood"
        averageMood:
          type: number
      required: [currentStreak, longestStreak, totalCheckins, weeklyMoods, averageMood]

    DailyMood:
      type: object
      properties:
        date:
          type: string
        mood:
          type: ["integer", "null"]
        dayLabel:
          type: string
      required: [date, dayLabel]

    MeditationSession:
      type: object
      properties:
        id:
          type: integer
        durationType:
          type: string
        durationSeconds:
          type: integer
        meditationType:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, durationType, durationSeconds, meditationType, createdAt]

    CreateMeditationRequest:
      type: object
      properties:
        durationType:
          type: string
        durationSeconds:
          type: integer
        meditationType:
          type: string
        notes:
          type: ["string", "null"]
      required: [durationType, durationSeconds, meditationType]

    MeditationStreakStats:
      type: object
      properties:
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        totalSessions:
          type: integer
        totalMinutes:
          type: integer
        weeklyActivity:
          type: array
          items:
            $ref: "#/components/schemas/DailyMeditationActivity"
      required: [currentStreak, longestStreak, totalSessions, totalMinutes, weeklyActivity]

    DailyMeditationActivity:
      type: object
      properties:
        date:
          type: string
        didMeditate:
          type: boolean
        dayLabel:
          type: string
        totalMinutes:
          type: integer
      required: [date, didMeditate, dayLabel, totalMinutes]

    CommunityFeedResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/CommunityPost"
        total:
          type: integer
        page:
          type: integer
      required: [posts, total, page]

    CommunityPost:
      type: object
      properties:
        id:
          type: integer
        snippet:
          type: string
        mood:
          type: integer
        aiReflection:
          type: ["string", "null"]
        quoteText:
          type: ["string", "null"]
        hugs:
          type: integer
        likes:
          type: integer
        checkOns:
          type: integer
        replyCount:
          type: integer
        timeAgo:
          type: string
        moodEmoji:
          type: string
      required: [id, snippet, mood, hugs, likes, checkOns, replyCount, timeAgo, moodEmoji]

    CommunityReply:
      type: object
      properties:
        id:
          type: integer
        postId:
          type: integer
        message:
          type: string
        timeAgo:
          type: string
      required: [id, postId, message, timeAgo]

    CreateReplyRequest:
      type: object
      properties:
        message:
          type: string
      required: [message]

    HugResponse:
      type: object
      properties:
        hugs:
          type: integer
      required: [hugs]

    LikeResponse:
      type: object
      properties:
        likes:
          type: integer
      required: [likes]

    CheckOnResponse:
      type: object
      properties:
        checkOns:
          type: integer
      required: [checkOns]

    Goal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
          description: "daily | weekly | monthly | stop"
        isPublic:
          type: boolean
        isCompleted:
          type: boolean
        completedAt:
          type: ["string", "null"]
        cheers:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, title, type, isPublic, isCompleted, cheers, createdAt]

    CreateGoalRequest:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          description: "daily | weekly | monthly | stop"
        isPublic:
          type: boolean
          default: false
      required: [title, type]

    UpdateGoalRequest:
      type: object
      properties:
        title:
          type: ["string", "null"]
        isCompleted:
          type: ["boolean", "null"]
        isPublic:
          type: ["boolean", "null"]

    DeleteGoalResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    CommunityGoal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
        isCompleted:
          type: boolean
        cheers:
          type: integer
        timeAgo:
          type: string
        typeLabel:
          type: string
      required: [id, title, type, isCompleted, cheers, timeAgo, typeLabel]

    CheerResponse:
      type: object
      properties:
        cheers:
          type: integer
      required: [cheers]
